<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="icon" type="image/png" href="/asset/image/favicon.png">
  <link rel="alternate icon" type="image/x-icon" href="/asset/image/favicon.ico">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      background: #fff;
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    header {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid #eee;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    header p {
      color: #666;
      font-size: 1rem;
    }
    nav {
      margin-top: 20px;
    }
    nav a {
      color: #333;
      text-decoration: none;
      margin: 0 12px;
      padding: 8px 16px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    nav a:hover {
      background: #f5f5f5;
      border-color: #ccc;
    }
    main {
      min-height: 400px;
    }
    h1, h2, h3 {
      margin-top: 2rem;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    h1 { font-size: 1.8rem; }
    h2 { font-size: 1.4rem; }
    h3 { font-size: 1.2rem; }
    p {
      margin-bottom: 1rem;
    }
    a {
      color: #333;
      text-decoration: underline;
    }
    a:hover {
      color: #000;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      font-weight: 600;
      background: #fafafa;
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .screenshot-table {
      border: none;
    }
    .screenshot-table td {
      border: none;
      text-align: center;
      padding: 10px;
    }
    .screenshot-table img {
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: #333;
      color: #fff !important;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      margin: 8px 8px 8px 0;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #000;
    }
    .btn-outline {
      background: #fff;
      color: #333 !important;
      border: 1px solid #ddd;
    }
    .btn-outline:hover {
      background: #f5f5f5;
    }
    footer {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid #eee;
      text-align: center;
      color: #999;
      font-size: 0.85rem;
    }
    .lang-switch {
      text-align: center;
      margin-bottom: 2rem;
      color: #666;
    }
    .lang-switch a {
      color: #666;
      text-decoration: none;
    }
    .lang-switch a:hover {
      text-decoration: underline;
    }
    .lang-switch .current {
      text-decoration: underline;
      font-weight: 600;
    }
    .center {
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Kano PDF Tool</h1>
    <p>{{ page.description | default: site.description }}</p>
    <nav>
      <a href="{{ site.baseurl }}/">Home</a>
      <a href="{{ site.baseurl }}/support/">Support</a>
      <a href="{{ site.baseurl }}/privacy/">Privacy</a>
      <a href="https://github.com/IDK-Silver/PDF_Tool">GitHub</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    &copy; 2026 Yu Feng Huang. MIT License.
  </footer>
</body>
</html>
