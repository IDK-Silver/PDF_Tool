name: Manual Tauri Release

on:
  workflow_dispatch:

# 讓 GITHUB_TOKEN 有權限可以 push
permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare changelog with LLM
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.body }}
      release_title: ${{ steps.changelog.outputs.title }}
      version: ${{ steps.tauri_version.outputs.version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read version from Tauri config
        id: tauri_version
        run: |
          VERSION=$(node -e "const fs=require('fs'); const cfg=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); const v=cfg.version || (cfg.package && cfg.package.version) || ''; if(!v){console.error('version not found'); process.exit(1);} console.log(v);")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Get previous tag
        id: prev_tag
        run: |
          git fetch --tags
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT
        shell: bash

      - name: Collect commit messages
        id: commits
        run: |
          PREV_TAG="${{ steps.prev_tag.outputs.tag }}"

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag, use last 50 commits"
            LOG=$(git log -n 50 --pretty=format:'- %s')
          else
            echo "Previous tag: $PREV_TAG"
            LOG=$(git log "$PREV_TAG"..HEAD --pretty=format:'- %s')
          fi

          LOG_ESCAPED=$(printf "%s" "$LOG" | sed ':a;N;$!ba;s/\n/\\n/g')
          echo "text=$LOG_ESCAPED" >> $GITHUB_OUTPUT
        shell: bash

      - name: Generate changelog with OpenAI
        id: changelog
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMITS: ${{ steps.commits.outputs.text }}
        run: |
          # 使用 jq 來構建 JSON，避免轉義問題
          JSON=$(jq -n \
            --arg model "gpt-5-mini-2025-08-07" \
            --arg system_content "你是一個專業的軟體更新紀錄撰寫助手。請分析 commit 訊息並以 JSON 格式輸出。\n\n輸出格式：\n{\n  \"title\": \"簡短總結（5-10 字，用詞客觀不誇張）\",\n  \"body\": \"詳細更新內容\"\n}\n\ntitle 規則：\n- 用詞客觀、專業，避免「重大」、「全新」、「革命性」等誇張詞彙\n- 簡潔描述本次更新的主要內容\n- 不包含版本號（版本號會自動添加）\n- 範例：「新增選單系統與錯誤修復」、「優化效能與介面調整」、「修復多項問題」\n\nbody 格式：\n## 新功能 (Features)\n- **子分類**\n  - 功能描述（重點用粗體標記）\n\n---\n\n## 效能優化 (Performance)\n- **子分類**\n  - 優化描述\n\n---\n\n## 問題修復 (Fixes)\n- **子分類**\n  - 修復描述\n\n---\n\n## 重構與內部改進 (Refactoring & Chores)\n- 重構描述\n\nbody 注意事項：\n1. 每個大類別用 --- 分隔\n2. 子分類用粗體標記\n3. 重點功能/技術名詞用粗體標記\n4. 描述要專業且詳細\n5. 如果某個類別沒有內容，可以省略該類別\n\n請確保輸出是有效的 JSON 格式。" \
            --arg user_content "以下是上一個版本到現在的 commit 訊息，請整理成更新紀錄：\n\n$COMMITS" \
            '{
              model: $model,
              messages: [
                {role: "system", content: $system_content},
                {role: "user", content: $user_content}
              ]
            }')

          echo "Calling OpenAI API..."
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$JSON")

          # 檢查是否有錯誤
          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$ERROR" ]; then
            echo "OpenAI API Error: $ERROR"
            echo "Full response: $RESPONSE"
            exit 1
          fi

          # 提取 LLM 回應的內容
          CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$CONTENT" ] || [ "$CONTENT" = "null" ]; then
            echo "Failed to extract content from response"
            echo "Full response: $RESPONSE"
            exit 1
          fi

          # 解析 JSON 格式的 title 和 body
          TITLE=$(echo "$CONTENT" | jq -r '.title // empty')
          BODY=$(echo "$CONTENT" | jq -r '.body // empty')

          if [ -z "$TITLE" ] || [ "$TITLE" = "null" ]; then
            echo "Failed to extract title from LLM response"
            echo "LLM response: $CONTENT"
            exit 1
          fi

          if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
            echo "Failed to extract body from LLM response"
            echo "LLM response: $CONTENT"
            exit 1
          fi

          echo "Changelog generated successfully"
          echo "Title: $TITLE"

          # 輸出 title
          {
            echo 'title<<EOF'
            echo "$TITLE"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

          # 輸出 body
          {
            echo 'body<<EOF'
            echo "$BODY"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
        shell: bash

  build:
    name: Build Tauri App
    runs-on: ${{ matrix.os }}
    needs: prepare-release

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    env:
      TAURI_SKIP_ISOLATION: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
        shell: bash

      - name: Fetch PDFium binaries (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # macOS Universal Binary 需要兩個架構的 PDFium
          npm run pdfium:fetch -- --targets aarch64-apple-darwin,x86_64-apple-darwin
        shell: bash

      - name: Fetch PDFium binaries (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # Windows x64
          npm run pdfium:fetch -- --targets x86_64-pc-windows-msvc

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin || true

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        run: |
          choco install -y nsis

      - name: Build & Release with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 簽名與公證（需要 Apple Developer 帳號）
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: "v${{ needs.prepare-release.outputs.version }}"
          releaseName: "v${{ needs.prepare-release.outputs.version }} - ${{ needs.prepare-release.outputs.release_title }}"
          releaseBody: ${{ needs.prepare-release.outputs.changelog }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }}

  update-readme:
    name: Update README download links
    runs-on: ubuntu-latest
    needs: [prepare-release, build]
    if: ${{ needs.build.result == 'success' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README download links
        run: |
          VERSION=${{ needs.prepare-release.outputs.version }}

          # 更新 macOS 下載連結（Universal Binary）
          # tag 帶 v 前綴，但檔名不帶 v
          sed -E -i "s#(releases/download/)v?[0-9.]+(/Kano\.PDF\.Tool_)[0-9.]+(_universal\.dmg)#\1v${VERSION}\2${VERSION}\3#g" README.md

          # 更新 Windows 下載連結
          sed -E -i "s#(releases/download/)v?[0-9.]+(/Kano\.PDF\.Tool_)[0-9.]+(_x64-setup\.exe)#\1v${VERSION}\2${VERSION}\3#g" README.md

        shell: bash

      - name: Commit and push if changed
        run: |
          VERSION=${{ needs.prepare-release.outputs.version }}

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 如果有修改才 commit
          if ! git diff --quiet; then
            git commit -am "chore: update README download links for v${VERSION}"
            git push
          else
            echo "No README changes"
          fi
        shell: bash