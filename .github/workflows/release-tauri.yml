name: Manual Tauri Release

on:
  # 還是可以手動按
  workflow_dispatch:

  # 只要有人 push 並且有改到 tauri.conf.json，就自動觸發
  push:
    paths:
      - "src-tauri/tauri.conf.json"

# 讓 GITHUB_TOKEN 有權限可以 push
permissions:
  contents: write

jobs:
  detect-version-change:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # 要看到上一個 commit
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check version changed
        id: check
        run: |
          # 讀現在的版本
          CURR=$(node -e "const fs=require('fs'); const cfg=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8')); const v=cfg.version || (cfg.package && cfg.package.version) || ''; if(!v){console.error('current version not found'); process.exit(1);} console.log(v);")

          echo "version=$CURR" >> $GITHUB_OUTPUT

          # 如果是手動觸發，不管版本有沒有變都照跑
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger detected, will release regardless of version change."
            echo "should_release=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 自動觸發時才檢查版本是否改變
          echo "Auto trigger detected, checking version change..."

          # 嘗試讀上一個 commit 的 tauri.conf.json
          if git show HEAD^:src-tauri/tauri.conf.json > /tmp/prev-tauri.conf.json 2>/dev/null; then
            PREV=$(node -e "const fs=require('fs'); const cfg=JSON.parse(fs.readFileSync('/tmp/prev-tauri.conf.json','utf8')); const v=cfg.version || (cfg.package && cfg.package.version) || ''; console.log(v);")
          else
            PREV=""
          fi

          echo "Current version: $CURR"
          echo "Previous version: $PREV"

          if [ "$CURR" != "$PREV" ]; then
            echo "Version changed, should release."
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "Version did not change, skip release."
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

  prepare-release:
    name: Prepare changelog with LLM
    runs-on: ubuntu-latest
    needs: detect-version-change
    if: ${{ needs.detect-version-change.outputs.should_release == 'true' }}
    outputs:
      changelog: ${{ steps.changelog.outputs.body }}
      release_title: ${{ steps.changelog.outputs.title }}
      # version 可以直接沿用 detect 的
      version: ${{ needs.detect-version-change.outputs.version }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get previous tag
        id: prev_tag
        run: |
          git fetch --tags
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT
        shell: bash

      - name: Collect commit messages
        id: commits
        run: |
          PREV_TAG="${{ steps.prev_tag.outputs.tag }}"

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag, use last 50 commits"
            LOG=$(git log -n 50 --pretty=format:'- %s')
          else
            echo "Previous tag: $PREV_TAG"
            LOG=$(git log "$PREV_TAG"..HEAD --pretty=format:'- %s')
          fi

          LOG_ESCAPED=$(printf "%s" "$LOG" | sed ':a;N;$!ba;s/\n/\\n/g')
          echo "text=$LOG_ESCAPED" >> $GITHUB_OUTPUT
        shell: bash

      - name: Generate changelog with OpenAI
        id: changelog
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          COMMITS: ${{ steps.commits.outputs.text }}
        run: |
          # 使用 jq 來構建 JSON，避免轉義問題
          JSON=$(jq -n \
            --arg model "gpt-5.1-2025-11-13" \
            --arg system_content "你是一個專業的軟體更新紀錄撰寫助手。請分析 commit 訊息並以 JSON 格式輸出。\n\n輸出格式：\n{\n  \"title\": \"簡短總結（5-10 字，用詞客觀不誇張）\",\n  \"body\": \"詳細更新內容\"\n}\n\ntitle 規則：\n- 用詞客觀、專業，避免「重大」、「全新」、「革命性」等誇張詞彙\n- 簡潔描述本次更新的主要內容\n- 不包含版本號（版本號會自動添加）\n- 範例：「新增選單系統與錯誤修復」、「優化效能與介面調整」、「修復多項問題」\n\nbody 格式：\n## 新功能 (Features)\n- **子分類**\n  - 功能描述（重點用粗體標記）\n\n---\n\n## 效能優化 (Performance)\n- **子分類**\n  - 優化描述\n\n---\n\n## 問題修復 (Fixes)\n- **子分類**\n  - 修復描述\n\n---\n\n## 重構與內部改進 (Refactoring & Chores)\n- 重構描述\n\nbody 注意事項：\n1. 每個大類別用 --- 分隔\n2. 子分類用粗體標記\n3. 重點功能/技術名詞用粗體標記\n4. 描述要專業且詳細\n5. 如果某個類別沒有內容，可以省略該類別\n6. **避免提到檔名、路徑、函式名稱、變數名稱等程式碼細節，除非與使用者功能高度相關**\n7. **盡量用使用者或產品角度描述變更，例如「改善 PDF 渲染效能」、「新增批次匯出功能」，而不是描述具體程式碼修改**\n8. **對於純重構、命名調整、lint 修正等細微改動，可以合併成一兩條概括敘述，不要逐條展開**\n\n請確保輸出是有效的 JSON 格式。" \
            --arg user_content "以下是上一個版本到現在的 commit 訊息，請整理成更新紀錄：\n\n$COMMITS" \
            '{
              model: $model,
              messages: [
                {role: "system", content: $system_content},
                {role: "user", content: $user_content}
              ],
              reasoning_effort: "medium"
            }')

          echo "Calling OpenAI API..."
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$JSON")

          # 檢查是否有錯誤
          ERROR=$(echo "$RESPONSE" | jq -r '.error.message // empty')
          if [ -n "$ERROR" ]; then
            echo "OpenAI API Error: $ERROR"
            echo "Full response: $RESPONSE"
            exit 1
          fi

          # 提取 LLM 回應的內容
          CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')

          if [ -z "$CONTENT" ] || [ "$CONTENT" = "null" ]; then
            echo "Failed to extract content from response"
            echo "Full response: $RESPONSE"
            exit 1
          fi

          # 解析 JSON 格式的 title 和 body
          TITLE=$(echo "$CONTENT" | jq -r '.title // empty')
          BODY=$(echo "$CONTENT" | jq -r '.body // empty')

          if [ -z "$TITLE" ] || [ "$TITLE" = "null" ]; then
            echo "Failed to extract title from LLM response"
            echo "LLM response: $CONTENT"
            exit 1
          fi

          if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
            echo "Failed to extract body from LLM response"
            echo "LLM response: $CONTENT"
            exit 1
          fi

          echo "Changelog generated successfully"
          echo "Title: $TITLE"

          # 輸出 title
          {
            echo 'title<<EOF'
            echo "$TITLE"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

          # 輸出 body
          {
            echo 'body<<EOF'
            echo "$BODY"
            echo 'EOF'
          } >> $GITHUB_OUTPUT
        shell: bash

  build:
    name: Build Tauri App
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    if: ${{ needs.prepare-release.result == 'success' }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    env:
      TAURI_SKIP_ISOLATION: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
        shell: bash

      - name: Fetch PDFium binaries (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # macOS Universal Binary 需要兩個架構的 PDFium
          npm run pdfium:fetch -- --targets aarch64-apple-darwin,x86_64-apple-darwin
        shell: bash

      - name: Fetch PDFium binaries (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # Windows x64
          npm run pdfium:fetch -- --targets x86_64-pc-windows-msvc

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin || true

      - name: Import Apple certificates
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPSTORE_APP_CERTIFICATE: ${{ secrets.APPSTORE_APP_CERTIFICATE }}
          APPSTORE_INSTALLER_CERTIFICATE: ${{ secrets.APPSTORE_INSTALLER_CERTIFICATE }}
          APPSTORE_CERTIFICATE_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATE_PASSWORD }}
          APPSTORE_PROVISIONING_PROFILE: ${{ secrets.APPSTORE_PROVISIONING_PROFILE }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import Developer ID certificate (for GitHub release)
          echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Import App Store certificates
          echo "$APPSTORE_APP_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/appstore_app.p12
          security import $RUNNER_TEMP/appstore_app.p12 -P "$APPSTORE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          echo "$APPSTORE_INSTALLER_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/appstore_installer.p12
          security import $RUNNER_TEMP/appstore_installer.p12 -P "$APPSTORE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Allow codesign to access the keys
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Install intermediate certificates (ignore if already exists)
          curl -o $RUNNER_TEMP/DeveloperIDG2CA.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import $RUNNER_TEMP/DeveloperIDG2CA.cer -k "$KEYCHAIN_PATH" || true

          curl -o $RUNNER_TEMP/AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import $RUNNER_TEMP/AppleWWDRCAG3.cer -k "$KEYCHAIN_PATH" || true

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPSTORE_PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/appstore.provisionprofile

      - name: Sign PDFium libraries (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # Sign both architectures of libpdfium.dylib
          for arch in aarch64-apple-darwin x86_64-apple-darwin; do
            DYLIB="src-tauri/resources/pdfium/${arch}/libpdfium.dylib"
            if [ -f "$DYLIB" ]; then
              codesign --force --options runtime --timestamp \
                --sign "Developer ID Application: Yu Feng Huang (S9782747Y9)" \
                "$DYLIB"
              echo "Signed $DYLIB"
            fi
          done

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        run: |
          choco install -y nsis

      - name: Build & Release with Tauri (GitHub version)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple signing & notarization (macOS only)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # Tauri updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: "v${{ needs.prepare-release.outputs.version }}"
          releaseName: "v${{ needs.prepare-release.outputs.version }} - ${{ needs.prepare-release.outputs.release_title }}"
          releaseBody: ${{ needs.prepare-release.outputs.changelog }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }}

      # Build App Store version (macOS only, no auto-update)
      - name: Prepare App Store build
        if: matrix.os == 'macos-latest'
        run: |
          # Remove updater capability for App Store build
          rm -f src-tauri/capabilities/updater.json

          # Switch to App Store entitlements
          cp src-tauri/macos/entitlements.appstore.plist src-tauri/macos/entitlements.plist

          # Update tauri.conf.json for App Store:
          # 1. Use App Store signing identity
          # 2. Disable updater artifacts (App Store doesn't support self-update)
          sed -i '' 's/Developer ID Application: Yu Feng Huang (S9782747Y9)/3rd Party Mac Developer Application: Yu Feng Huang (S9782747Y9)/g' src-tauri/tauri.conf.json
          sed -i '' 's/"createUpdaterArtifacts": true/"createUpdaterArtifacts": false/g' src-tauri/tauri.conf.json

          # Clean previous build artifacts
          rm -rf src-tauri/target/universal-apple-darwin/release/bundle

      - name: Build App Store version
        if: matrix.os == 'macos-latest'
        run: |
          npx tauri build --target universal-apple-darwin --features app-store -- --no-default-features

      - name: Sign and package for App Store
        if: matrix.os == 'macos-latest'
        run: |
          VERSION=${{ needs.prepare-release.outputs.version }}
          APP_PATH=$(find src-tauri/target/universal-apple-darwin/release/bundle -name "*.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found"
            exit 1
          fi

          echo "Found app at: $APP_PATH"

          # Embed provisioning profile for App Store distribution
          if [ -f "$HOME/Library/MobileDevice/Provisioning Profiles/appstore.provisionprofile" ]; then
            cp "$HOME/Library/MobileDevice/Provisioning Profiles/appstore.provisionprofile" \
              "$APP_PATH/Contents/embedded.provisionprofile"
          else
            echo "Error: provisioning profile not found"
            exit 1
          fi

          # Generate entitlements with application identifier from profile
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/appstore.provisionprofile"
          PROFILE_PLIST="$RUNNER_TEMP/appstore_profile.plist"
          ENTITLEMENTS_PATH="$RUNNER_TEMP/entitlements.appstore.generated.plist"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.application-identifier" "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.team-identifier" "$PROFILE_PLIST")

          if [ -z "$APP_ID" ] || [ -z "$TEAM_ID" ]; then
            echo "Error: failed to read identifiers from provisioning profile"
            exit 1
          fi

          cp src-tauri/macos/entitlements.appstore.plist "$ENTITLEMENTS_PATH"
          /usr/libexec/PlistBuddy -c "Set :com.apple.application-identifier $APP_ID" "$ENTITLEMENTS_PATH" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string $APP_ID" "$ENTITLEMENTS_PATH"
          /usr/libexec/PlistBuddy -c "Set :com.apple.developer.team-identifier $TEAM_ID" "$ENTITLEMENTS_PATH" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :com.apple.developer.team-identifier string $TEAM_ID" "$ENTITLEMENTS_PATH"

          # Re-sign bundled PDFium dylibs with App Store identity
          for arch in aarch64-apple-darwin x86_64-apple-darwin; do
            DYLIB="$APP_PATH/Contents/Resources/resources/pdfium/${arch}/libpdfium.dylib"
            if [ -f "$DYLIB" ]; then
              codesign --force --options runtime --timestamp \
                --sign "3rd Party Mac Developer Application: Yu Feng Huang (S9782747Y9)" \
                "$DYLIB"
              echo "Signed $DYLIB"
            fi
          done

          # Re-sign the app with App Store certificate and entitlements
          codesign --deep --force --options runtime \
            --entitlements "$ENTITLEMENTS_PATH" \
            --sign "3rd Party Mac Developer Application: Yu Feng Huang (S9782747Y9)" \
            "$APP_PATH"

          # Create .pkg for App Store submission
          mkdir -p appstore-artifacts
          productbuild --component "$APP_PATH" /Applications \
            --sign "3rd Party Mac Developer Installer: Yu Feng Huang (S9782747Y9)" \
            "appstore-artifacts/Kano.PDF.Tool_${VERSION}_appstore.pkg"

          # Also create a zip of the .app for testing
          cd "$(dirname "$APP_PATH")"
          zip -r "$GITHUB_WORKSPACE/appstore-artifacts/Kano.PDF.Tool_${VERSION}_appstore.app.zip" "$(basename "$APP_PATH")"
          cd "$GITHUB_WORKSPACE"

          ls -la appstore-artifacts/

      - name: Upload App Store artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: appstore-macos-universal
          path: appstore-artifacts/*
          retention-days: 90

  generate-updater-json:
    name: Generate updater manifest
    runs-on: ubuntu-latest
    needs: [prepare-release, build]
    if: ${{ needs.build.result == 'success' }}

    steps:
      - name: Generate latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          # Wait for release assets to be available (retry logic)
          MAX_RETRIES=12
          RETRY_DELAY=15

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES: Fetching release assets..."

            # Draft releases can't be found via /releases/tags endpoint
            # Use /releases endpoint and filter by tag_name instead
            RELEASE=$(gh api -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/releases" \
              --jq ".[] | select(.tag_name == \"v${VERSION}\")" | head -1)

            if [ -z "$RELEASE" ]; then
              echo "Release v${VERSION} not found yet..."
              if [ $i -eq $MAX_RETRIES ]; then
                echo "Failed to find release after $MAX_RETRIES attempts"
                exit 1
              fi
              sleep $RETRY_DELAY
              continue
            fi

            # Find signature files and download URLs
            ASSETS=$(echo "$RELEASE" | jq -r '.assets')

            # macOS Universal
            MAC_URL=$(echo "$ASSETS" | jq -r '[.[] | select(.name | endswith("_universal.app.tar.gz"))] | first | .browser_download_url // empty')
            MAC_SIG=$(echo "$ASSETS" | jq -r '[.[] | select(.name | endswith("_universal.app.tar.gz.sig"))] | first | .browser_download_url // empty')

            # Windows x64
            WIN_URL=$(echo "$ASSETS" | jq -r '[.[] | select(.name | endswith("_x64-setup.exe"))] | first | .browser_download_url // empty')
            WIN_SIG=$(echo "$ASSETS" | jq -r '[.[] | select(.name | endswith("_x64-setup.exe.sig"))] | first | .browser_download_url // empty')

            # Check if we have all required assets
            if [ -n "$MAC_URL" ] && [ "$MAC_URL" != "null" ] && \
               [ -n "$WIN_URL" ] && [ "$WIN_URL" != "null" ] && \
               [ -n "$MAC_SIG" ] && [ "$MAC_SIG" != "null" ] && \
               [ -n "$WIN_SIG" ] && [ "$WIN_SIG" != "null" ]; then
              echo "All assets found!"
              break
            fi

            if [ $i -eq $MAX_RETRIES ]; then
              echo "Failed to find all release assets after $MAX_RETRIES attempts"
              echo "MAC_URL: $MAC_URL"
              echo "MAC_SIG: $MAC_SIG"
              echo "WIN_URL: $WIN_URL"
              echo "WIN_SIG: $WIN_SIG"
              echo ""
              echo "Available assets:"
              echo "$ASSETS" | jq -r '.[].name'
              exit 1
            fi

            echo "Assets not ready yet, waiting ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

          NOTES=$(echo "$RELEASE" | jq -r '.body // ""')
          PUB_DATE=$(echo "$RELEASE" | jq -r '.published_at // empty')
          if [ -z "$PUB_DATE" ] || [ "$PUB_DATE" = "null" ]; then
            PUB_DATE=$(echo "$RELEASE" | jq -r '.created_at // empty')
          fi

          # Download signatures
          MAC_SIG_CONTENT=""
          WIN_SIG_CONTENT=""

          if [ -n "$MAC_SIG" ] && [ "$MAC_SIG" != "null" ]; then
            MAC_SIG_CONTENT=$(curl -sL "$MAC_SIG")
          fi

          if [ -n "$WIN_SIG" ] && [ "$WIN_SIG" != "null" ]; then
            WIN_SIG_CONTENT=$(curl -sL "$WIN_SIG")
          fi

          # Generate latest.json
          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": $(echo "$NOTES" | jq -Rs .),
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-universal": {
                "signature": "${MAC_SIG_CONTENT}",
                "url": "${MAC_URL}"
              },
              "darwin-x86_64": {
                "signature": "${MAC_SIG_CONTENT}",
                "url": "${MAC_URL}"
              },
              "darwin-aarch64": {
                "signature": "${MAC_SIG_CONTENT}",
                "url": "${MAC_URL}"
              },
              "windows-x86_64": {
                "signature": "${WIN_SIG_CONTENT}",
                "url": "${WIN_URL}"
              }
            }
          }
          EOF

          cat latest.json

          # Validate latest.json fields are present and non-empty
          validate_field() {
            local key="$1"
            local val
            val=$(jq -r "$key // empty" latest.json)
            if [ -z "$val" ] || [ "$val" = "null" ] || [ "$val" = "Not Found" ]; then
              echo "Invalid latest.json: $key is empty or missing"
              exit 1
            fi
          }

          validate_field '.pub_date'
          validate_field '.platforms["darwin-universal"].url'
          validate_field '.platforms["darwin-universal"].signature'
          validate_field '.platforms["windows-x86_64"].url'
          validate_field '.platforms["windows-x86_64"].signature'

      - name: Upload latest.json to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          gh release upload "v${VERSION}" latest.json --clobber --repo ${{ github.repository }}

      - name: Publish release (remove draft status)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          gh release edit "v${VERSION}" --draft=false --repo ${{ github.repository }}
          echo "Release v${VERSION} published!"

  update-readme:
    name: Update README download links
    runs-on: ubuntu-latest
    needs: [prepare-release, build, generate-updater-json]
    if: ${{ needs.build.result == 'success' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README download links
        run: |
          VERSION=${{ needs.prepare-release.outputs.version }}

          # 更新 macOS 下載連結（Universal Binary）
          # tag 帶 v 前綴，但檔名不帶 v
          sed -E -i "s#(releases/download/)v?[0-9.]+(/Kano\.PDF\.Tool_)[0-9.]+(_universal\.dmg)#\1v${VERSION}\2${VERSION}\3#g" README.md

          # 更新 Windows 下載連結
          sed -E -i "s#(releases/download/)v?[0-9.]+(/Kano\.PDF\.Tool_)[0-9.]+(_x64-setup\.exe)#\1v${VERSION}\2${VERSION}\3#g" README.md

        shell: bash

      - name: Commit and push if changed
        run: |
          VERSION=${{ needs.prepare-release.outputs.version }}

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 如果有修改才 commit
          if ! git diff --quiet; then
            git commit -am "chore: update README download links for v${VERSION}"
            git push
          else
            echo "No README changes"
          fi
        shell: bash
