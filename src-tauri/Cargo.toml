[package]
name = "kano_pdf_tool"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["self-update"]
self-update = ["dep:tauri-plugin-updater"]
app-store = []

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kano_pdf_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1.19"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
pdfium-render = { version = "0.8.35", default-features = false, features = ["pdfium_latest", "thread_safe", "image_latest"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
png = "0.17"
webp = "0.3"
indexmap = "2.11.4"
log = "0.4"
urlencoding = "2"
lopdf = "0.32"
flate2 = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1.0"
tauri-plugin-updater = { version = "2", optional = true }
base64 = "0.22.1"
font-kit = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSData", "NSError", "NSString"] }
